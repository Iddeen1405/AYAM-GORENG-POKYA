  <ellipse cx="300" cy="350" rx="75" ry="55" fill="none" stroke="#C97B12" stroke-width="5"/>
  <path d="M262 330 q38-22 76 0 M260 352 q40-24 80 0 M268 372 q32-18 64 0" stroke="#C97B12" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".7"/>
