<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4068AC"/><stop offset="100%" stop-color="#2F4D7F"/>
    </linearGradient>
    <linearGradient id="ch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC53D"/><stop offset="100%" stop-color="#E8960C"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="#F4F8FE"/>
  <rect x="70" y="380" width="460" height="140" rx="18" fill="url(#tray)"/>
  <rect x="70" y="380" width="460" height="26" rx="13" fill="#2F4D7F"/>
  <!-- rice box -->
  <rect x="105" y="240" width="120" height="140" rx="10" fill="#fff" stroke="#C7D8F0" stroke-width="4"/>
  <rect x="105" y="240" width="120" height="34" rx="10" fill="#4068AC"/>
  <text x="165" y="285" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#16324F">NASI</text>
  <text x="165" y="305" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#4068AC">PUTIH</text>
  <!-- chicken piece on tray -->
