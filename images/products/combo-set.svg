  <circle cx="440" cy="355" r="10" fill="#7FB069"/><circle cx="465" cy="365" r="10" fill="#E63946"/>
  <!-- drink -->
  <rect x="505" y="230" width="34" height="150" rx="8" fill="#FFD100"/>
  <rect x="505" y="230" width="34" height="30" rx="8" fill="#4068AC"/>
  <rect x="512" y="200" width="8" height="34" rx="4" fill="#16324F"/>
  <text x="300" y="90" text-anchor="middle" font-family="Arial Black" font-size="30" fill="#16324F">COMBO SET</text>
  <text x="300" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#4068AC">AYAM + NASI + ULAM + MINUMAN</text>
